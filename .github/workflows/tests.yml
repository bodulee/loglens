name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Install package
        run: python -m pip install .
      - name: Check installed command
        shell: python
        run: |
          import json
          from pathlib import Path
          import shutil
          import subprocess
          import tempfile
          fixture = str(Path("examples/access.log").resolve())
          command = shutil.which("loglens")
          assert command, "Installed command not found"
          with tempfile.TemporaryDirectory() as folder:
              result = subprocess.run([command, fixture, "--json"], cwd=folder, check=True, capture_output=True, text=True)
          assert json.loads(result.stdout)["requests"] == 5
